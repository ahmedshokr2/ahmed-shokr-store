<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة | Ahmed Shokr</title><link rel="stylesheet" href="style.css"><style>.admin{max-width:1100px;margin:35px auto;padding:0 16px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:18px 0}.admin input,.admin button,.admin select{padding:11px;border:1px solid var(--line);border-radius:9px;margin:5px;font:inherit}.admin input{max-width:100%}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:750px}td,th{text-align:right;padding:10px;border-bottom:1px solid var(--line)}.msg{line-height:1.8;color:var(--muted)}#orders{display:none}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">AS</span><span><b>AHMED SHOKR</b><small>ADMIN</small></span></a><a class="small-btn" href="index.html">عرض المتجر</a></header><main class="admin"><h1>لوحة إدارة الطلبات</h1><section class="panel" id="loginPanel"><h2>تسجيل دخول المدير</h2><p class="msg">استخدم البريد وكلمة المرور لحساب Firebase Authentication الذي أنشأته.</p><form id="loginForm"><input id="email" type="email" required autocomplete="username" placeholder="البريد الإلكتروني"><input id="password" type="password" required autocomplete="current-password" placeholder="كلمة المرور"><button class="primary-btn" type="submit">دخول</button></form><p id="loginMsg" class="msg"></p></section><section id="orders" class="panel"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between"><h2>الطلبات</h2><div><button id="refresh">تحديث</button><button id="logout">تسجيل خروج</button></div></div><p id="adminMsg" class="msg"></p><div class="table-wrap"><table><thead><tr><th>رقم</th><th>العميل</th><th>الموبايل</th><th>الباقة</th><th>السعر</th><th>الحالة</th><th>التاريخ</th><th>حفظ</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script type="module" src="admin.js"></script></body></html>
